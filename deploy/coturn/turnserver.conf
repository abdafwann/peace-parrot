# Coturn TURN/STUN Server Configuration for Roompeak (PeaceParrot) WebRTC Voice
# Listening ports
listening-port=3478
tls-listening-port=5349

# Min and max dynamic relay UDP port range
min-port=49152
max-port=65535

# Fingerprint mechanism
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm & Server Name (Replace with your actual domain or IP in production)
realm=roompeak.local
server-name=roompeak-turn

# Static user authentication (Format: username:password)
# Example user for WebRTC clients:
user=roompeak_user:SecretTurnPass123!

# Security settings
no-cli
no-tls
no-dtls
# Enable the following lines when TLS certificates are mounted:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Logging
verbose
log-file=stdout
