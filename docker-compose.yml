services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roompeak-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_PATH=/app/data/peace-parrot.db
      - MIGRATIONS_PATH=/app/migrations
      - JWT_SECRET=${JWT_SECRET:-changeme-production-super-secret-key-64bytes}
      - JWT_EXPIRY_DAYS=${JWT_EXPIRY_DAYS:-7}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    volumes:
      - roompeak_data:/app/data
      - roompeak_uploads:/app/uploads
    networks:
      - roompeak_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:latest
    container_name: roompeak-coturn
    restart: unless-stopped
    network_mode: "host" # Host networking is recommended for TURN/STUN relay to avoid NAT bottleneck
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  roompeak_data:
    driver: local
  roompeak_uploads:
    driver: local

networks:
  roompeak_net:
    driver: bridge
